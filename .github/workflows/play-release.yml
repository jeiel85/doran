# Play용 AAB를 CI에서 빌드해 내부 테스트와 Alpha 두 트랙에 올립니다(README "릴리스").
#
# - 태그 v<x.y.z>가 올라오면(scripts/release.sh가 GitHub 릴리스를 낼 때) 그 버전을 올립니다.
# - Actions 화면에서 손으로 돌릴 수도 있습니다(version 입력). dry_run을 켜면 빌드·서명 확인·트랙 조회까지만 하고 올리지 않습니다.
# 비밀값은 GitHub 환경 'play'에만 있고, 그 환경은 main 브랜치·v* 태그에서만 열립니다. 실행마다 승인은 받지 않습니다
# (2026-11-28 사용자 결정 — 릴리스와 함께 바로 올라가게. CI가 올리는 곳은 내부 테스트·Alpha뿐이고 프로덕션은 Play Console에서 손으로).
name: Play release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '버전 (x.y.z, CHANGELOG에 항목이 있어야 함)'
        required: true
      dry_run:
        description: '올리지 않고 빌드·서명 확인·트랙 조회만'
        type: boolean
        default: false

concurrency:
  group: play-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  play:
    runs-on: ubuntu-latest
    environment: play
    timeout-minutes: 40
    env:
      PACKAGE: com.jeiel85.doran
      # Play 업로드 키 인증서(DECISIONS.md D-16). 다른 키로 서명된 번들은 올리기 전에 멈춥니다.
      UPLOAD_CERT_SHA256: 'DF:B8:B4:EC:34:D1:E6:DE:E7:5C:D3:CD:E9:30:61:6A:1F:B7:54:8C:91:9D:DA:7B:9B:F5:0B:75:C5:1D:F7:8E'
    steps:
      - uses: actions/checkout@v4

      - name: 버전 정하기
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
          DRY: ${{ inputs.dry_run }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then VER="${GITHUB_REF_NAME#v}"; else VER="$INPUT_VERSION"; fi
          [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::버전은 x.y.z여야 합니다: $VER"; exit 1; }
          grep -q "^## \[$VER\]" CHANGELOG.md || { echo "::error::CHANGELOG.md에 $VER 항목이 없습니다"; exit 1; }
          IFS=. read -r MA MI PA <<<"$VER"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "code=$((MA * 10000 + MI * 100 + PA))" >> "$GITHUB_OUTPUT"
          echo "dry=${DRY:-false}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: 서명 키·Firebase 설정 놓기
        env:
          KEYSTORE_B64: ${{ secrets.DORAN_PLAY_UPLOAD_KEYSTORE_B64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p .keystore
          printf '%s' "$KEYSTORE_B64" | base64 -d > .keystore/doran-play-upload.jks
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          [ -s .keystore/doran-play-upload.jks ] && [ -s android/app/google-services.json ]

      - name: AAB 빌드(시험 포함)
        env:
          DORAN_PLAY_UPLOAD_STORE_FILE: ../.keystore/doran-play-upload.jks
          DORAN_PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.DORAN_PLAY_UPLOAD_STORE_PASSWORD }}
          DORAN_PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.DORAN_PLAY_UPLOAD_KEY_ALIAS }}
          DORAN_PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.DORAN_PLAY_UPLOAD_KEY_PASSWORD }}
          VER: ${{ steps.ver.outputs.version }}
        run: |
          scripts/play-bundle.sh "$VER" || { cat dist/logs/*.log | tail -n 80; exit 1; }
          AAB=$(ls dist/doran-play-"$VER"-*.aab)
          echo "AAB=$AAB" >> "$GITHUB_ENV"

      - name: 출시 노트(CHANGELOG에서, 500자까지)
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          awk -v a="## [$VER]" 'index($0, a)==1 {on=1; next} /^## / {on=0} on && /^- / {print "• " substr($0, 3)}' CHANGELOG.md > dist/notes-full.txt
          python3 - <<'PY'
          s = open("dist/notes-full.txt", encoding="utf-8").read().strip()
          if len(s) > 500:
              s = s[:499].rsplit("\n", 1)[0] if "\n" in s[:499] else s[:499]
              s = s.rstrip() + "…"
          open("dist/notes-ko.txt", "w", encoding="utf-8").write(s)
          print(f"{len(s)}자")
          PY
          cat dist/notes-ko.txt

      - uses: actions/upload-artifact@v4
        with:
          name: doran-play-${{ steps.ver.outputs.version }}
          path: |
            ${{ env.AAB }}
            dist/notes-ko.txt
          retention-days: 30

      - name: Play 트랙 상태(올리기 전)
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: pwsh -NoProfile -File tools/play-publish.ps1 -PackageName "$PACKAGE" -ShowTracks

      - name: 내부 테스트·Alpha에 올리기
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          CODE: ${{ steps.ver.outputs.code }}
          DRY: ${{ steps.ver.outputs.dry }}
        run: |
          DRYFLAG=(); [ "$DRY" = true ] && DRYFLAG=(-DryRun)
          pwsh -NoProfile -File tools/play-publish.ps1 -PackageName "$PACKAGE" -Track internal -AabPath "$AAB" \
            -ExpectedUploadCertSha256 "$UPLOAD_CERT_SHA256" -NotesKoFile dist/notes-ko.txt "${DRYFLAG[@]}"
          pwsh -NoProfile -File tools/play-publish.ps1 -PackageName "$PACKAGE" -Track alpha -ExpectedVersionCode "$CODE" \
            -NotesKoFile dist/notes-ko.txt "${DRYFLAG[@]}"

      - name: Play 트랙 상태(올린 뒤)
        if: steps.ver.outputs.dry != 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: pwsh -NoProfile -File tools/play-publish.ps1 -PackageName "$PACKAGE" -ShowTracks

      - name: 키 지우기
        if: always()
        run: rm -f .keystore/doran-play-upload.jks android/app/google-services.json
