name = "doran-relay"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "doran-relay"
# scripts/deploy-relay.sh가 만든 D1 (APAC, 2026-11-17).
database_id = "e65058dd-b55c-47a2-9c2d-418d9756ab44"
migrations_dir = "migrations"

[triggers]
crons = ["23 4 * * *"]

[observability]
enabled = true

# 비밀값(이 파일에 넣지 않음): FCM_SERVICE_ACCOUNT — Firebase 서비스 계정 JSON.
#   npx wrangler secret put FCM_SERVICE_ACCOUNT < service-account.json
# 없으면 깨우기 없이 동작하고 폰은 주기 동기화로 따라잡습니다 (DECISIONS.md D-9).
